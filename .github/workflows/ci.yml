# CI: Backend (Python) + Frontend (Next.js) on push and PRs
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  # Minimal env so config.py can load (values not used in CI)
  OPENAI_API_KEY: "sk-dummy-for-ci"
  MICROSOFT_CLIENT_ID: "dummy"
  MICROSOFT_CLIENT_SECRET: "dummy"
  LANGFUSE_PUBLIC_KEY: "dummy"
  LANGFUSE_SECRET_KEY: "dummy"

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ruff
        run: pip install ruff

      - name: Lint (Ruff)
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Verify app imports
        run: python -c "import config; from app import helpers; print('OK')"

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8002"
