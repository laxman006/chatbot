# ============================================================================
# RATE LIMITING ZONES - Protection against DoS and brute force attacks
# ============================================================================
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# Connection limiting (prevent too many connections from single IP)
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ============================================================================
# UPSTREAM BLOCKS - Connection pooling for better performance
# ============================================================================
upstream backend_pool {
    server backend:8002;
    keepalive 32;  # Reuse connections
    keepalive_requests 100;
    keepalive_timeout 60s;
}

upstream frontend_pool {
    server frontend:3000;
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
error_log /var/log/nginx/error.log warn;

# Log format for security monitoring
log_format security '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

# ============================================================================
# BLOCK COMMON ATTACK PATTERNS
# ============================================================================
map $request_uri $blocked {
    default 0;
    ~*\.(env|git|svn|htaccess|htpasswd|ini|log|sh|sql|bak|old)$ 1;
    ~*/(\.git|\.svn|\.env|wp-admin|wp-login|phpmyadmin|adminer) 1;
}

# Block suspicious user agents (but allow legitimate bots)
map $http_user_agent $block_ua {
    default 0;
    ~*(sqlmap|nikto|nmap|masscan|zap|burp|acunetix|nessus|dirbuster) 1;
}

# HTTP Server - Serves content until SSL is configured
# After SSL certificate is set up, uncomment the redirect line below and remove location blocks
server {
    listen 80;
    server_name ai.cloudfuze.com 159.89.164.11;

    # Request size limits
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    
    # Connection limits
    limit_conn conn_limit 20;
    
    # Block malicious requests
    if ($blocked) {
        return 403;
    }
    
    if ($block_ua) {
        return 403;
    }

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
    
    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Basic security headers (without HSTS since we're on HTTP)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    
    # Hide server version
    server_tokens off;

    # ============================================================================
    # BACKEND API ENDPOINTS - Must come BEFORE the root catch-all location
    # ============================================================================

    # Analytics endpoints - MUST be before root location to match first
    location /analytics/ {
        proxy_pass http://backend_pool/analytics/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts - Increased for analytics queries
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # API proxy endpoints - Handle /api/proxy/* requests
    location /api/proxy/ {
        rewrite ^/api/proxy/(.*) /$1 break;
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Cookie support
        proxy_cookie_path / /;
        
        # Timeouts
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Next.js API route for shared chat - MUST come before /api/ block
    location /api/shared-chat/ {
        proxy_pass http://frontend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # API endpoints - Direct to Backend (includes /api/chat/*)
    location /api/ {
        proxy_pass http://backend_pool/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Streaming support for /api/chat/stream
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Chat API endpoints (backend) - Must come before frontend catch-all
    location ~ ^/chat/(sessions|history|stream|share)(/|$) {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }

    # Shared chat endpoint - route based on request type
    location ~ ^/chat/shared/[^/]+$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        
        # If this is an API request (requesting JSON), proxy to backend
        if ($http_accept ~* "application/json") {
            proxy_pass http://backend_pool;
            break;
        }
        
        # If not an API request (page request), proxy to frontend
        proxy_pass http://frontend_pool;
    }

    # Chat streaming endpoint
    location = /chat {
        proxy_pass http://backend_pool/chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    # Chat POST endpoint (for backward compatibility)
    location = /chat/ {
        proxy_pass http://backend_pool/chat/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    # Specific auth callback endpoint
    location /auth/microsoft/callback {
        proxy_pass http://backend_pool/auth/microsoft/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts - Increased to handle backend initialization
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Other auth endpoints
    location /auth/ {
        proxy_pass http://backend_pool/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts - Increased to handle backend initialization
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Health check
    location /health {
        proxy_pass http://backend_pool/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Feedback endpoint
    location /feedback {
        proxy_pass http://backend_pool/feedback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # User profile endpoints (onboarding)
    location /user/ {
        proxy_pass http://backend_pool/user/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Teams list endpoint (onboarding)
    location /teams/ {
        proxy_pass http://backend_pool/teams/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # ============================================================================
    # STATIC FILES AND FRONTEND - Must come after backend endpoints
    # ============================================================================

    # Serve static images - proxy to frontend
    location /images/ {
        proxy_pass http://frontend_pool/images/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Next.js static files (_next/)
    location /_next/static/ {
        proxy_pass http://frontend_pool;
        proxy_cache_valid 200 60m;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy to Next.js frontend - CATCH-ALL (must be last)
    location / {
        proxy_pass http://frontend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    # http2 on;  # Temporarily disabled - HTTP/2 protocol errors with large headers
    server_name ai.cloudfuze.com 159.89.164.11;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/ai.cloudfuze.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.cloudfuze.com/privkey.pem;
    
    # Request size limits
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    
    # Connection limits
    limit_conn conn_limit 20;
    
    # Buffer sizes for proxy
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    proxy_temp_file_write_size 8k;
    
    # Block malicious requests
    if ($blocked) {
        return 403;
    }
    
    if ($block_ua) {
        return 403;
    }

    # SSL Security Settings - Enhanced
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;  # More secure - prevents session ticket reuse attacks
    
    # OCSP Stapling - Improves SSL performance and security
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/ai.cloudfuze.com/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ============================================================================
    # COMPREHENSIVE SECURITY HEADERS
    # ============================================================================
    
    # HSTS - Force HTTPS for 1 year, include subdomains, preload ready
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # XSS Protection (legacy but still useful)
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Control referrer information
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Permissions Policy (formerly Feature-Policy) - Restrict browser features
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    
    # Prevent Flash/PDF cross-domain policies
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    
    # Content Security Policy - Strict but compatible with Next.js and Microsoft OAuth
    # Adjust based on your actual requirements
    add_header Content-Security-Policy "default-src 'self'; \
        script-src 'self' 'unsafe-eval' 'unsafe-inline' https://login.microsoftonline.com https://graph.microsoft.com; \
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
        font-src 'self' https://fonts.gstatic.com data:; \
        img-src 'self' data: blob: https:; \
        connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com https://*.cloudfuze.com wss://*.cloudfuze.com; \
        frame-src 'self' https://login.microsoftonline.com; \
        object-src 'none'; \
        base-uri 'self'; \
        form-action 'self' https://login.microsoftonline.com; \
        frame-ancestors 'self'; \
        upgrade-insecure-requests;" always;
    
    # Remove server version from headers (security through obscurity)
    server_tokens off;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # ============================================================================
    # BACKEND API ENDPOINTS - Must come BEFORE the root catch-all location
    # ============================================================================

    # Analytics endpoints - MUST be before root location to match first
    location /analytics/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        
        proxy_pass http://backend_pool/analytics/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts - Increased for analytics queries
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # API proxy endpoints - Handle /api/proxy/* requests
    location /api/proxy/ {
        rewrite ^/api/proxy/(.*) /$1 break;
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
