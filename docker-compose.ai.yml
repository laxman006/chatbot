services:
  nginx:
    image: nginx:alpine
    container_name: slack2teams-nginx-ai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-ai.conf:/etc/nginx/conf.d/default.conf:ro
      - ./images:/var/www/html/images:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: https://ai.cloudfuze.com
    image: slack2teams-frontend-ai:latest
    container_name: slack2teams-frontend-ai
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://ai.cloudfuze.com
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod.light
    image: slack2teams-backend-ai:latest
    container_name: slack2teams-backend-ai
    env_file:
      - .env.ai
    environment:
      # File paths (hardcoded, not from .env.ai)
      JSON_MEMORY_FILE: "/app/data/chat_history.json"
      # Production settings (hardcoded, not from .env.ai)
      PYTHONUNBUFFERED: "1"
      ENVIRONMENT: "production"
      # Note: All other environment variables are loaded from .env.ai via env_file directive above
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - weaviate

  # Weaviate vector database
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
    container_name: slack2teams-weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - ENABLE_MODULES=
      - CLUSTER_HOSTNAME=node1
    volumes:
      - ./weaviate:/var/lib/weaviate
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
networks:
  app-network:
    driver: bridge

